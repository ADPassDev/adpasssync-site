# Typecheck and tests on every pull request and every push to main.
#
# Cloudflare Workers Builds deploys main to adpasssync.com on every push, so
# this is the last check before production. Make the "Typecheck and tests"
# check required in the main branch ruleset.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: the job only checks out and tests the code.
permissions:
  contents: read

# A newer push to a pull request cancels its older run. Pushes to main group
# by commit, so every commit that deploys gets its own result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Actions are pinned to release commits; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The tests run TypeScript directly (--experimental-strip-types).
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Starts a local `wrangler dev` with a throwaway R2 state directory.
      # Nothing remote is touched and no Cloudflare credentials are needed.
      - name: End-to-end downloads checks
        run: npm run test:dev
